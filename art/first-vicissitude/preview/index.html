<h2>头部复合纹饰前后对照</h2>
<p>八片晶壳各自增加多层椭圆环线、菱形符印、交织分枝和内卷纹，保留流动曲线与金色、紫红、淡粉的上色。每片构图独立，纹线像素数约为上一版的两到三倍；原生 96×96 图稿的线宽仍严格为 1 像素。本轮几何、UV、其他部位和自发光层保持一致。同机位、同姿态、同光照、同尺寸。</p>
<div class="pair">
<figure><a href="03-lower-before.png"><img src="03-lower-before.png" alt="调整前较简疏的卷线"></a><figcaption>03 · 调整前：较简疏纹样</figcaption></figure>
<figure><a href="04-lower-after.png"><img src="04-lower-after.png" alt="八片独立设计的一像素复合纹饰"></a><figcaption>04 · 调整后：八片复合纹样</figcaption></figure>
