<h1>无常 · 模型预览</h1>
<p>只看这页即可。所有图片均为 Blender 离线预览，不是游戏截图。点击图片查看原图。</p>
<h2>当前整体</h2>

<h2>二阶段骨翼尺寸前后对照</h2>
<p>骨翼外段的伸展幅度增加约 20%，翼根附近的连接位置保留，翼尖、弯钩和枝杈随外段展开。沿用原有逐表面纹饰、UV 和厚度，网格与三角面数量不增加。同机位、同姿态、同光照、同尺寸。</p>
<div class="pair">
<figure><a href="03-lower-before.png"><img src="03-lower-before.png" alt="加大前的二阶段骨翼"></a><figcaption>03 · 调整前：原骨翼</figcaption></figure>
<figure><a href="04-lower-after.png"><img src="04-lower-after.png" alt="外段伸展幅度增加约百分之二十的骨翼"></a><figcaption>04 · 调整后：加大骨翼</figcaption></figure>
</div>
