// .\gradlew.bat -I art/weeping-wither/tools/preview.init.gradle weepingWitherPreview --offline
gradle.projectsEvaluated {
    def project = gradle.rootProject
    def previewClasses = project.layout.buildDirectory.dir('weeping-wither-preview/classes')
    def compilePreview = project.tasks.register('compileWeepingWitherPreview', JavaCompile) {
        dependsOn project.tasks.named('classes')
        source = project.files('art/weeping-wither/tools/WeepingWitherPreview.java')
        classpath = project.sourceSets.main.runtimeClasspath
        destinationDirectory = previewClasses
        options.encoding = 'UTF-8'
        javaCompiler = project.javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(17) }
    }
    project.tasks.register('weepingWitherPreview', JavaExec) {
        dependsOn compilePreview
        classpath = project.files(previewClasses) + project.sourceSets.main.runtimeClasspath
        mainClass = 'WeepingWitherPreview'
        workingDir = project.layout.buildDirectory.dir('weeping-wither-preview').get().asFile
        args project.projectDir.absolutePath
        javaLauncher = project.javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    }
}
