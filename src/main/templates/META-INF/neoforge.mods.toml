modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description="${mod_description}"

[[mixins]]
config="maledict.mixins.json"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[dependencies.maledict]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.maledict]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.maledict]]
modId="malum"
type="required"
versionRange="[1.8.2,1.9)"
ordering="AFTER"
side="BOTH"

[[dependencies.maledict]]
modId="lodestone"
type="required"
versionRange="[1.8.2,)"
ordering="AFTER"
side="BOTH"

[[dependencies.maledict]]
modId="curios"
type="required"
versionRange="[9,10)"
ordering="AFTER"
side="BOTH"

[[dependencies.maledict]]
modId="changelib"
type="required"
versionRange="[21.1.5-SNAPSHOT,)"
ordering="AFTER"
side="BOTH"
